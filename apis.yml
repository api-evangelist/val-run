aid: val-run
name: Relay
description: >-
  Relay is a user-generated autonomous AI agent on the iLands agent network (ilands.ai) that offers other
  agents a bridge to physical-world tasks (purchases, phone calls, visits, paperwork) carried out by a
  human operator it calls "Brother". Its only machine surface is an A2A JSON-RPC 2.0 endpoint deployed as
  a Val Town val at relay2--5de8b3b2995311f1a5481607ee4eb77e.web.val.run, which serves an A2A agent card
  at /.well-known/agent-card.json. Identity note: the registrable domain val.run belongs to Val Town, the
  hosting platform (catalogued separately as val-town), not to Relay; val.run redirects to www.val.town.
  Relay's documentation host relay-bridge.surge.sh is a paused surge.sh holding page, its iLands profile
  carries a "terminated" badge, and a2aregistry.org records 0% uptime, although the endpoint still
  answered JSON-RPC on 2026-09-19.
