  description: >-
    A2A JSON-RPC 2.0 endpoint for the Relay agent, deployed as a Val Town val. GET on the root returns a
    plain-text banner naming the methods it accepts (SendMessage, GetTask, GetExtendedAgentCard,
    CancelTask) and pointing at its agent card; a POST of tasks/get with an unknown id returned a
    well-formed JSON-RPC error (-32001 Task not found) on 2026-09-19. The served card declares one skill
    (real-world-carry), no security schemes, and streaming, pushNotifications and stateTransitionHistory
    all false. No OpenAPI, GraphQL, MCP or other contract exists for it.
